services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: finanzas
      POSTGRES_DB: finanzas
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas -d finanzas"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command:
      - sh
      - -c
      - pip install -q -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://finanzas:finanzas@postgres:5432/finanzas
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  dashboard:
    build: .
    command:
      - sh
      - -c
      - pip install -q -r requirements.txt && streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://finanzas:finanzas@postgres:5432/finanzas
      STREAMLIT_SERVER_HEADLESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  pgdata:
